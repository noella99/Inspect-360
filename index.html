<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspector 360">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Inspector 360</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#ecebe7;--card:#fff;--fg:#1b2330;--mut:#5d6675;--bd:#d3d1ca;--pri:#1f4e79;--onp:#fff;--hv:#f2b705;--ok:#2e7d4f;--wa:#b86e00;--er:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1d2631;--fg:#e8ebef;--mut:#9aa4b2;--bd:#334050;--pri:#6aa6dd;--onp:#0f1720;--ok:#5cc489;--wa:#f0a93a;--er:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1d2631;--fg:#e8ebef;--mut:#9aa4b2;--bd:#334050;--pri:#6aa6dd;--onp:#0f1720;--ok:#5cc489;--wa:#f0a93a;--er:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--fg);color:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:6px solid var(--hv)}
header b{font:700 22px/1 "Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.5px}
header span{font:500 18px "Barlow Semi Condensed",system-ui,sans-serif;opacity:.8}
#net{margin-left:auto;font-size:13px;font-family:system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font:700 20px/1.2 "Barlow Semi Condensed",system-ui,sans-serif;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input[type=range]{padding:0;margin:4px 0 12px;accent-color:var(--pri)}
textarea{min-height:80px}
.b{display:inline-block;border:0;border-radius:8px;padding:12px 16px;font:600 16px system-ui,sans-serif;background:var(--pri);color:var(--onp);cursor:pointer}
.b.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.b.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.Conforme,.Baixa{color:var(--ok)}.Atenção,.Média{color:var(--wa)}.Alta,.Crítica,.Embargo{color:var(--er)}
.Não{color:var(--er)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 4px;font:600 14px system-ui,sans-serif;color:var(--mut);border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--hv)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph div{position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.ph button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:24px;height:24px;background:#000a;color:#fff}
.item{border-top:1px solid var(--bd);padding:10px 0}.item:first-of-type{border-top:0}
#toast{position:fixed;left:14px;right:14px;bottom:96px;background:var(--fg);color:var(--bg);padding:12px;border-radius:8px;display:none;z-index:5}
.rep{background:#fff;color:#000;padding:18px;border-radius:10px}
.rep table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:14px}
.rep th,.rep td{border:1px solid #bbb;padding:6px;text-align:left}
.rep h2{border-bottom:3px solid #f2b705;padding-bottom:4px}
.sig{display:flex;gap:24px;margin-top:40px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:13px}
.rep .ph img{border-radius:0}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi div{background:var(--bg);border-radius:8px;padding:10px;font-size:14px;color:var(--mut)}.kpi b{display:block;font:700 30px "Barlow Semi Condensed",system-ui,sans-serif;color:var(--fg)}.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;padding:8px 2px;border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:8px;font-size:13px}.seg .on{background:var(--pri);color:var(--onp);border-color:var(--pri)}.ai{border-left:5px solid var(--hv)}html,body{overflow-x:hidden}.row>label{min-width:0}input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff;padding:0}main{max-width:none;padding:0}.rep{padding:0}}
</style>
</head>
<body>
<header><b>INSPECTOR</b><span>360</span><small id="net"></small></header>
<main id="app"></main>
<div id="toast"></div>
<nav class="noprint"><button data-v="dash">Painel</button><button data-v="vis">Nova visita</button><button data-v="his">Histórico</button><button data-v="ale">Alertas</button></nav>
<script>
var $=function(s){return document.querySelector(s)};
var E=["Fundações","Estrutura","Alvenaria","Cobertura","Instalações","Acabamentos"],PF=["Geral"].concat(E);
var CK=["Licença de construção visível na obra","Projecto aprovado disponível","Livro de obra actualizado","Estaleiro vedado e sinalizado","Equipamentos de protecção individual","Materiais armazenados correctamente","Execução conforme o projecto","Condições de segurança dos trabalhadores"];
var db={visits:[]},view="dash",cur=null,d;
try{db=JSON.parse(localStorage.getItem("ircop"))||db}catch(e){}
function nd(){return{id:Date.now(),obra:"",end:"",lic:"",tec:"",gps:null,et:E.map(function(){return 0}),estado:"Conforme",pf:"Geral",fotos:[],docs:[],ck:CK.map(function(){return""}),irr:[],notas:"",resumo:""}}
try{d=Object.assign(nd(),JSON.parse(localStorage.getItem("ircop_d")))}catch(e){d=nd()}
function sd(){try{localStorage.setItem("ircop_d",JSON.stringify(d))}catch(e){}}
function save(){try{localStorage.setItem("ircop",JSON.stringify(db));return true}catch(e){toast("Memória cheia. Guarde o relatório em PDF e apague visitas antigas.");return false}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var x=$("#toast");x.textContent=t;x.style.display="block";setTimeout(function(){x.style.display="none"},3500)}
function fmt(i){return new Date(i).toLocaleString("pt-AO",{dateStyle:"short",timeStyle:"short"})}
function fd(p){return p?p.split("-").reverse().join("/"):"sem prazo"}
function glob(e){return Math.round(e.reduce(function(a,b){return a+b},0)/e.length)}
function key(o){return o.trim().toLowerCase()}
function prev(o){if(!o.trim())return null;var l=db.visits.filter(function(v){return key(v.obra)===key(o)});return l.length?l[l.length-1].et:null}
function obras(){var s={};db.visits.forEach(function(v){s[v.obra]=1});return Object.keys(s)}
function tag(t){return'<span class="tag '+t.split(" ")[0]+'">'+esc(t)+"</span>"}
function gpsTxt(g){return g?"Lat "+g.lat+", Long "+g.lng+(g.man?" (introduzida manualmente)":" (precisão "+g.acc+" m)"):"Localização ainda não capturada"}
function alerts(){var a=[],h=new Date().toISOString().slice(0,10),m={};
 db.visits.forEach(function(v){v.irr.forEach(function(r){if(r.st==="aberta"){var late=r.prazo&&r.prazo<h;if(late||r.g==="Alta"||r.g==="Crítica")a.push({v:v,r:r,late:late})}});
  var k=key(v.obra);if(!m[k]||v.data>m[k].data)m[k]=v});
 Object.keys(m).forEach(function(k){if((Date.now()-new Date(m[k].data))/864e5>30)a.push({v:m[k],stale:1})});return a}
function vVis(){
 var o='<div class="card"><h2>Obra</h2><label>Nome ou código da obra<input data-k="obra" list="ol" value="'+esc(d.obra)+'"></label><datalist id="ol">'+obras().map(function(x){return'<option value="'+esc(x)+'">'}).join("")+'</datalist>'
 +'<label>Endereço<input data-k="end" value="'+esc(d.end)+'"></label><label>N.º da licença<input data-k="lic" value="'+esc(d.lic)+'"></label><label>Técnico responsável<input data-k="tec" value="'+esc(d.tec)+'"></label>'
 +'<button class="b s w" data-a="gps">Capturar localização GPS</button><p class="mut" style="margin:8px 0 0">'+gpsTxt(d.gps)+'</p><div class="row" style="margin-top:10px;align-items:flex-start"><label style="flex:1;margin:0">Latitude<input id="la" inputmode="decimal" placeholder="-8.8390"></label><label style="flex:1;margin:0">Longitude<input id="lo" inputmode="decimal" placeholder="13.2894"></label></div><button class="b s w" style="margin-top:8px" data-a="gm">Usar coordenadas manuais</button></div>'
 +'<div class="card"><h2>Estado da obra por fase</h2>'
 +E.map(function(n,i){return'<div class="row"><span>'+n+'</span><span class="mut">anterior <b class="pv" data-i="'+i+'">–</b></span><b id="ev'+i+'">'+d.et[i]+'%</b></div><input type="range" min="0" max="100" step="5" data-et="'+i+'" value="'+d.et[i]+'">'}).join("")
 +'<label>Avaliação geral<select data-k="estado">'+["Conforme","Atenção","Não conforme","Embargo recomendado"].map(function(s){return"<option"+(d.estado===s?" selected":"")+">"+s+"</option>"}).join("")+"</select></label></div>"
 +'<div class="card"><h2>Fotografias</h2><label>Fase<select data-k="pf">'+PF.map(function(s){return"<option"+(d.pf===s?" selected":"")+">"+s+"</option>"}).join("")+'</select></label>'
 +'<input id="fi" type="file" accept="image/*" capture="environment" multiple hidden><button class="b s w" data-a="ph">Tirar ou escolher fotografias</button>'
 +'<div class="ph">'+d.fotos.map(function(f,i){return'<div><img alt="" src="'+f.src+'"><button data-a="rf" data-x="'+i+'">×</button></div>'}).join("")+"</div></div>"
 +'<div class="card"><h2>Irregularidades</h2>'+d.irr.map(function(r,i){return'<div class="item row"><div>'+esc(r.t)+(r.ia?" (IA)":"")+'<br><span class="mut">Prazo: '+fd(r.prazo)+"</span></div><div>"+tag(r.g)+' <button class="b s" data-a="di" data-x="'+i+'">Remover</button></div></div>'}).join("")
 +'<label>Descrição<input id="it" placeholder="Ex.: fissura na viga do piso 1"></label><label>Recomendação<input id="ir" placeholder="Ex.: reforçar e reinspeccionar em 15 dias"></label><div class="row"><label style="flex:1">Gravidade<select id="ig"><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></label><label style="flex:1">Prazo<input id="ip" type="date"></label></div>'
 +'<button class="b s w" data-a="ai">Adicionar irregularidade</button></div>'
 +'<div class="card"><h2>Checklist técnica</h2>'+CK.map(function(c,i){return'<div class="item"><div>'+c+'</div><div class="seg">'+[["C","Conforme"],["NC","Não conforme"],["NA","N/A"]].map(function(s){return'<button data-a="ck" data-x="'+i+'" data-y="'+s[0]+'"'+(d.ck[i]===s[0]?' class="on"':'')+'>'+s[1]+'</button>'}).join("")+'</div></div>'}).join("")+'</div>'
 +'<div class="card"><h2>Documentos</h2><label>Tipo<select id="dt">'+["Licença de construção","Projecto aprovado","Auto de medição","Outro"].map(function(s){return"<option>"+s+"</option>"}).join("")+'</select></label><input id="di" type="file" multiple hidden><button class="b s w" data-a="dc">Anexar documento</button>'+d.docs.map(function(x,i){return'<div class="item row"><span>'+esc(x.t)+": "+esc(x.n)+'</span><button class="b s" data-a="rd" data-x="'+i+'">Remover</button></div>'}).join("")+'<p class="mut">Nesta demonstração guarda-se o tipo e o nome do ficheiro.</p></div>'
 +'<div class="card ai"><h2>Assistente de IA</h2><p class="mut">Escreva as observações. A IA organiza-as num rascunho de relatório. Não decide se a obra é legal ou ilegal: a avaliação é sempre do inspector.</p><label>Observações da visita<textarea data-k="notas">'+esc(d.notas)+'</textarea></label><button class="b s w" data-a="ai360">Organizar com IA</button><label style="margin-top:10px">Resumo do relatório (reveja e edite)<textarea data-k="resumo">'+esc(d.resumo)+'</textarea></label></div>'
 +'<button class="b w" data-a="sub">Submeter e gerar relatório</button>';return o}
function vDash(){var V=db.visits;if(!V.length)return'<div class="card"><h2>Painel de fiscalização</h2><p class="mut">Ainda sem visitas. Faça uma inspecção ou veja o painel com dados de demonstração.</p><button class="b w" data-a="demo">Carregar dados de demonstração</button></div>';
 var ob={},g={Baixa:0,Média:0,Alta:0,Crítica:0},ab=0,rs=0,nc=0,ct=0,tc={};
 V.forEach(function(v){var k=key(v.obra);if(!ob[k]||v.data>ob[k].data)ob[k]=v;tc[v.tec]=(tc[v.tec]||0)+1;v.irr.forEach(function(r){g[r.g]++;r.st==="aberta"?ab++:rs++});(v.ck||[]).forEach(function(c){if(c==="C"||c==="NC"){ct++;if(c==="NC")nc++}})});
 var O=Object.keys(ob).map(function(k){return ob[k]}),mx=Math.max.apply(null,Object.keys(g).map(function(k){return g[k]}).concat(1));
 function bar(l,n,m,t){return'<div class="row mut"><span>'+esc(l)+"</span><b>"+t+'</b></div><div class="bar"><i style="width:'+(m?Math.round(100*n/m):0)+'%"></i></div><div style="height:8px"></div>'}
 return'<div class="card"><h2>Indicadores de fiscalização</h2><div class="kpi"><div><b>'+O.length+'</b>obras monitorizadas</div><div><b>'+V.length+'</b>visitas</div><div><b>'+ab+'</b>ocorrências abertas</div><div><b>'+(ct?Math.round(100*(ct-nc)/ct):0)+'%</b>checklist conforme</div></div></div>'
 +'<div class="card"><h2>Execução por obra</h2>'+O.map(function(v){return bar(v.obra+" ("+v.estado+")",glob(v.et),100,glob(v.et)+"%")}).join("")+"</div>"
 +'<div class="card"><h2>Ocorrências por gravidade</h2>'+Object.keys(g).map(function(k){return bar(k,g[k],mx,g[k])}).join("")+'<p class="mut">Resolvidas: '+rs+" de "+(ab+rs)+"</p></div>"
 +'<div class="card"><h2>Visitas por técnico</h2>'+Object.keys(tc).map(function(k){return bar(k,tc[k],V.length,tc[k])}).join("")+'</div><button class="b s w" data-a="demo">Carregar ou remover dados de demonstração</button>'}
var hf="";function vHis(){var l=db.visits.slice().reverse().filter(function(v){return!hf||v.obra===hf});
 if(!l.length)return'<div class="card"><h2>Sem visitas</h2><p class="mut">Faça a primeira inspecção em Nova visita.</p></div>';
 return'<div class="card"><label>Filtrar por obra<select id="hf"><option value="">Todas</option>'+obras().map(function(o){return'<option'+(o===hf?" selected":"")+'>'+esc(o)+"</option>"}).join("")+"</select></label></div>"+l.map(function(v){return'<div class="card" data-a="op" data-x="'+v.id+'" style="cursor:pointer"><div class="row"><b>'+esc(v.obra)+"</b>"+tag(v.estado)+'</div><div class="mut">'+fmt(v.data)+" · Técnico: "+esc(v.tec)+'</div><div class="mut">Execução '+glob(v.et)+"% · "+v.irr.length+" irregularidade(s)"+(v.sync?" · sincronizada":" · por sincronizar")+"</div></div>"}).join("")}
function vAle(){var a=alerts();
 if(!a.length)return'<div class="card"><h2>Tudo em dia</h2><p class="mut">Nenhuma situação exige acompanhamento agora.</p></div>';
 return a.map(function(x){if(x.stale)return'<div class="card"><div class="row"><b>'+esc(x.v.obra)+"</b>"+tag("Atenção")+'</div><div class="mut">Sem visita desde '+fmt(x.v.data)+". Agende nova inspecção.</div></div>";
  return'<div class="card"><div class="row"><b>'+esc(x.v.obra)+"</b>"+tag(x.r.g)+"</div><div>"+esc(x.r.t)+'</div>'+(x.r.rec?'<div class="mut">Recomendação: '+esc(x.r.rec)+'</div>':'')+'<div class="mut">'+(x.late?"Prazo vencido: ":"Prazo: ")+fd(x.r.prazo)+' · visita de '+fmt(x.v.data)+'</div><p style="margin:10px 0 0"><button class="b s" data-a="rs" data-x="'+x.v.id+'" data-y="'+x.r.id+'">Marcar como resolvida</button></p></div>'}).join("")}
function vRep(){var v=db.visits.filter(function(x){return x.id===cur})[0];if(!v)return"";var p=null;
 var ant=db.visits.filter(function(x){return key(x.obra)===key(v.obra)&&x.data<v.data});if(ant.length)p=ant[ant.length-1].et;
 return'<p class="noprint row"><button class="b s" data-a="bk">Voltar</button><button class="b" data-a="pdf">Gerar PDF</button></p><p class="mut noprint">O PDF é criado e guardado no seu aparelho.</p>'
 +'<div class="rep"><h2>Relatório de inspecção</h2><table><tr><th>Obra</th><td>'+esc(v.obra)+"</td><th>Licença</th><td>"+esc(v.lic||"–")+"</td></tr><tr><th>Endereço</th><td>"+esc(v.end||"–")+"</td><th>Data</th><td>"+fmt(v.data)+"</td></tr><tr><th>Técnico</th><td>"+esc(v.tec)+"</td><th>Avaliação</th><td><b>"+esc(v.estado)+"</b></td></tr><tr><th>GPS</th><td colspan=3>"+gpsTxt(v.gps)+"</td></tr></table>"
 +"<h2>Execução por fase ("+glob(v.et)+"% no total)</h2><table><tr><th>Fase</th><th>Anterior</th><th>Actual</th></tr>"+E.map(function(n,i){return"<tr><td>"+n+"</td><td>"+(p?p[i]+"%":"–")+"</td><td>"+v.et[i]+"%</td></tr>"}).join("")+"</table>"
 +"<h2>Irregularidades</h2>"+(v.irr.length?"<table><tr><th>Descrição</th><th>Recomendação</th><th>Gravidade</th><th>Prazo</th><th>Estado</th></tr>"+v.irr.map(function(r){return"<tr><td>"+esc(r.t)+"</td><td>"+esc(r.rec||"–")+"</td><td>"+r.g+"</td><td>"+fd(r.prazo)+"</td><td>"+r.st+"</td></tr>"}).join("")+"</table>":"<p>Nenhuma registada.</p>")
 +"<h2>Checklist técnica</h2><table>"+CK.map(function(c,i){return"<tr><td>"+c+"</td><td>"+({C:"Conforme",NC:"Não conforme",NA:"N/A"}[(v.ck||[])[i]]||"Não verificado")+"</td></tr>"}).join("")+"</table>"+(v.docs&&v.docs.length?"<h2>Documentos</h2><p>"+v.docs.map(function(x){return esc(x.t)+": "+esc(x.n)}).join("<br>")+"</p>":"")+(v.resumo?"<h2>Resumo</h2><p>"+esc(v.resumo)+"</p><p><small>Rascunho organizado com apoio de IA e revisto pelo inspector. A IA não avalia a legalidade da obra.</small></p>":"")+"<h2>Notas</h2><p>"+(esc(v.notas)||"–")+"</p>"
 +(v.fotos.length?"<h2>Fotografias</h2><div class=\"ph\">"+v.fotos.map(function(f){return'<div><img alt="" src="'+f.src+'"><small>'+esc(f.fase)+" · "+fmt(f.t)+"</small></div>"}).join("")+"</div>":"")
 +'<div class="sig"><div>Técnico: '+esc(v.tec)+'</div><div>Responsável da obra</div></div></div>'}
var lv="";function render(){var sy=lv===view?window.scrollY:0,m={vis:vVis,his:vHis,ale:vAle,rep:vRep,dash:vDash};$("#app").innerHTML=m[view]();
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view);if(b.dataset.v==="ale"){var n=alerts().length;b.textContent="Alertas"+(n?" ("+n+")":"")}});
 if(view==="vis")upv();window.scrollTo(0,sy);lv=view;net()}
function upv(){var p=prev(d.obra);document.querySelectorAll(".pv").forEach(function(e){e.textContent=p?p[+e.dataset.i]+"%":"–"})}
function shrink(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
